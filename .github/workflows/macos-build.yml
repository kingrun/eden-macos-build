name: Build Eden macOS

on:
  push:
    branches: [macos]
  pull_request:
    branches: [macos]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        
      - name: Create externals directory
        run: mkdir -p externals
        
      - name: Clone cubeb
        run: |
          git clone https://github.com/mozilla/cubeb.git externals/cubeb
          cd externals/cubeb
          # Checkout a known compatible version if needed
          # git checkout <specific-commit-or-tag>
          
      - name: Clone other dependencies
        run: |
          git clone https://github.com/boostorg/boost.git externals/boost
          cd externals/boost
          git checkout boost-1.80.0
          
          git clone https://github.com/FFmpeg/FFmpeg.git externals/ffmpeg
          cd externals/ffmpeg
          git checkout n5.1.2
          
      - name: Install Dependencies
        run: |
          brew update
          brew install cmake qt@5 glew sdl2 libpng libzip ffmpeg pkgconfig

      - name: Setup Qt
        run: |
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@5)" >> $GITHUB_ENV
          echo "PATH=$(brew --prefix qt@5)/bin:$PATH" >> $GITHUB_ENV

      - name: Configure Build
        run: |
          mkdir build
          cd build
          cmake .. \
            -DCMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH \
            -DBOOST_ROOT=externals/boost \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Eden
        run: |
          cd build
          cmake --build . --config Release --parallel $(sysctl -n hw.ncpu)

      - name: Package as DMG
        run: |
          cd build
          cpack -G DragNDrop

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eden-macOS
          path: build/*.dmg
