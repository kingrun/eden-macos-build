name: Build Eden macOS
on:
  push:
    branches: [macos]
  pull_request:
    branches: [macos]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Don't fetch submodules initially - we'll handle them manually
        
      # Manual submodule handling - bypassing Git's submodule system
      - name: Manual submodule setup
        run: |
          echo "Setting up submodules manually to avoid nested issues..."
          
          # Create externals directory
          mkdir -p externals
          
          # Clone cubeb manually
          echo "Cloning cubeb..."
          git clone --depth=1 https://github.com/mozilla/cubeb.git externals/cubeb
          
          # Handle libusb with the specific nested structure Eden expects
          echo "Setting up libusb with nested structure..."
          
          # First create the parent libusb directory
          mkdir -p externals/libusb
          
          # Clone libusb into the nested location that Eden expects
          git clone --depth=1 https://github.com/libusb/libusb.git externals/libusb/libusb
          
          # Also create a .gitmodules-like structure to fool CMake if needed
          echo "Creating libusb parent structure..."
          cd externals/libusb
          # Create any files that might be expected in the parent
          touch README.md
          echo "libusb submodule parent" > README.md
          cd ../..
          
          # Clone other common dependencies that Eden might need
          echo "Cloning other potential dependencies..."
          
          # Clone dynarmic if needed
          if [ ! -d "externals/dynarmic" ]; then
            git clone --depth=1 https://github.com/merryhime/dynarmic.git externals/dynarmic || echo "dynarmic not needed"
          fi
          
          # Clone fmt if needed  
          if [ ! -d "externals/fmt" ]; then
            git clone --depth=1 https://github.com/fmtlib/fmt.git externals/fmt || echo "fmt not needed"
          fi
          
          # Clone spdlog if needed
          if [ ! -d "externals/spdlog" ]; then
            git clone --depth=1 https://github.com/gabime/spdlog.git externals/spdlog || echo "spdlog not needed"
          fi
          
          # Clone catch2 if needed
          if [ ! -d "externals/catch2" ]; then
            git clone --depth=1 https://github.com/catchorg/Catch2.git externals/catch2 || echo "catch2 not needed"
          fi
          
          # Clone discord-rpc if needed
          if [ ! -d "externals/discord-rpc" ]; then
            git clone --depth=1 https://github.com/discord/discord-rpc.git externals/discord-rpc || echo "discord-rpc not needed"
          fi
          
          # Clone inih if needed
          if [ ! -d "externals/inih" ]; then
            git clone --depth=1 https://github.com/benhoyt/inih.git externals/inih || echo "inih not needed"
          fi
          
          # Clone openssl if needed
          if [ ! -d "externals/openssl" ]; then
            git clone --depth=1 https://github.com/openssl/openssl.git externals/openssl || echo "openssl not needed"
          fi
          
          echo "Listing externals structure:"
          find externals -type d -maxdepth 2 | sort
          
      - name: Verify critical dependencies
        run: |
          echo "Verifying critical dependencies exist..."
          
          # Check cubeb
          if [ -d "externals/cubeb" ] && [ "$(ls -A externals/cubeb)" ]; then
            echo "✓ cubeb found"
            ls -la externals/cubeb/ | head -5
          else
            echo "✗ cubeb missing"
            exit 1
          fi
          
          # Check libusb nested structure - the exact path CMake is looking for
          if [ -d "externals/libusb/libusb" ] && [ "$(ls -A externals/libusb/libusb)" ]; then
            echo "✓ libusb nested structure found"
            ls -la externals/libusb/
            ls -la externals/libusb/libusb/ | head -5
          else
            echo "✗ libusb nested structure missing"
            echo "Current externals/libusb structure:"
            ls -la externals/libusb/ || echo "externals/libusb doesn't exist"
            
            # Try emergency fix - create the exact structure
            echo "Creating emergency libusb structure..."
            rm -rf externals/libusb
            mkdir -p externals/libusb
            git clone --depth=1 https://github.com/libusb/libusb.git externals/libusb/libusb
            
            if [ -d "externals/libusb/libusb" ] && [ "$(ls -A externals/libusb/libusb)" ]; then
              echo "✓ Emergency libusb setup successful"
              ls -la externals/libusb/libusb/ | head -5
            else
              echo "✗ Emergency libusb setup failed"
              # Show what we actually have
              find externals -name "*libusb*" -type d
              exit 1
            fi
          fi
          
          # Show final structure
          echo "Final externals structure:"
          find externals -maxdepth 3 -type d | sort
          
      - name: Install Dependencies
        run: |
          brew update
          brew install cmake qt@5 glew sdl2 libpng libzip ffmpeg pkg-config
          
      - name: Setup Qt Environment
        run: |
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@5)" >> $GITHUB_ENV
          echo "$(brew --prefix qt@5)/bin" >> $GITHUB_PATH
          echo "PKG_CONFIG_PATH=$(brew --prefix qt@5)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          
      - name: Configure Build
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@5)" \
            -DQt5_DIR="$(brew --prefix qt@5)/lib/cmake/Qt5" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 \
            -DENABLE_TESTS=OFF \
            -DENABLE_COMPATIBILITY_TESTS=OFF
            
      - name: Build Eden
        run: |
          cd build
          cmake --build . --config Release --parallel $(sysctl -n hw.ncpu)
          
      - name: Create App Bundle
        run: |
          cd build
          echo "Looking for Eden executable..."
          find . -name "*eden*" -type f -executable 2>/dev/null || echo "No eden executable found yet"
          ls -la
          
          # Try to find the main executable
          if [ -f "eden" ]; then
            echo "Found eden executable"
            EXECUTABLE="eden"
          elif [ -f "Eden" ]; then
            echo "Found Eden executable"
            EXECUTABLE="Eden"
          elif [ -f "src/eden" ]; then
            echo "Found src/eden executable"
            EXECUTABLE="src/eden"
          elif [ -f "src/Eden" ]; then
            echo "Found src/Eden executable"
            EXECUTABLE="src/Eden"
          else
            echo "Searching for any executable..."
            find . -type f -executable -name "*eden*" || echo "No eden executable found"
            EXECUTABLE=""
          fi
          
          if [ -n "$EXECUTABLE" ]; then
            echo "Creating app bundle with $EXECUTABLE"
            mkdir -p Eden.app/Contents/MacOS
            mkdir -p Eden.app/Contents/Resources
            
            # Copy executable
            cp "$EXECUTABLE" Eden.app/Contents/MacOS/Eden
            
            # Create Info.plist
            cat > Eden.app/Contents/Info.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Eden</string>
              <key>CFBundleIdentifier</key>
              <string>com.eden.emulator</string>
              <key>CFBundleName</key>
              <string>Eden</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
          </dict>
          </plist>
          EOF
            
            echo "App bundle created successfully"
          else
            echo "No executable found, creating archive of build directory"
          fi
          
      - name: Package
        run: |
          cd build
          
          if [ -d "Eden.app" ]; then
            # Create DMG if we have an app bundle
            echo "Creating DMG..."
            hdiutil create -srcfolder Eden.app -volname "Eden" -fs HFS+ -fsargs "-c c=64,a=16,e=16" -format UDRW temp-eden.dmg
            hdiutil convert temp-eden.dmg -format UDZO -imagekey zlib-level=9 -o Eden-macOS.dmg
            rm temp-eden.dmg
          else
            # Create tar.gz of build contents
            echo "Creating tar.gz archive..."
            tar -czf Eden-macOS.tar.gz *
          fi
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eden-macOS
          path: |
            build/*.dmg
            build/*.tar.gz
          if-no-files-found: warn
