name: Build Eden macOS
on:
  push:
    branches: [macos]
  pull_request:
    branches: [macos]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # Ensure full history for submodules
          
      # Explicitly handle submodules with more aggressive approach
      - name: Initialize and update submodules
        run: |
          git config --global --add safe.directory '*'
          git config --global protocol.file.allow always
          git submodule sync --recursive
          git submodule update --init --recursive --force --depth=1
          
      # Handle nested submodules explicitly
      - name: Handle nested submodules
        run: |
          echo "Checking and fixing all submodules..."
          
          # List all submodules
          git submodule status --recursive
          
          # Force update all submodules again
          git submodule foreach --recursive 'git submodule sync'
          git submodule foreach --recursive 'git submodule update --init --force'
          
          # Check for specific problematic submodules and handle them
          echo "Checking externals directory structure:"
          ls -la externals/ || echo "externals directory not found"
          
          # Handle cubeb
          if [ ! -d "externals/cubeb" ] || [ -z "$(ls -A externals/cubeb 2>/dev/null)" ]; then
            echo "Fixing cubeb submodule..."
            rm -rf externals/cubeb
            mkdir -p externals
            git clone --depth=1 https://github.com/mozilla/cubeb.git externals/cubeb
          fi
          
          # Handle libusb nested submodule
          if [ ! -d "externals/libusb/libusb" ] || [ -z "$(ls -A externals/libusb/libusb 2>/dev/null)" ]; then
            echo "Fixing libusb nested submodule..."
            if [ -d "externals/libusb" ]; then
              cd externals/libusb
              git submodule update --init --recursive --force
              cd ../..
            else
              echo "libusb parent directory not found, checking for alternative paths..."
              find . -name "libusb" -type d 2>/dev/null || echo "No libusb directories found"
            fi
          fi
          
          echo "Final submodule status:"
          git submodule status --recursive
          
      - name: Install Dependencies
        run: |
          brew update
          brew install cmake qt@5 glew sdl2 libpng libzip ffmpeg pkg-config
          
      - name: Setup Qt Environment
        run: |
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@5)" >> $GITHUB_ENV
          echo "$(brew --prefix qt@5)/bin" >> $GITHUB_PATH
          echo "PKG_CONFIG_PATH=$(brew --prefix qt@5)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          
      - name: Configure Build
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@5)" \
            -DQt5_DIR="$(brew --prefix qt@5)/lib/cmake/Qt5" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
            
      - name: Build Eden
        run: |
          cd build
          cmake --build . --config Release --parallel $(sysctl -n hw.ncpu)
          
      - name: Create App Bundle (if needed)
        run: |
          cd build
          # Check if there's a specific app bundle creation step needed
          if [ -f "eden" ] || [ -f "Eden" ]; then
            echo "Found Eden executable"
            ls -la
          fi
          
      - name: Package as DMG
        run: |
          cd build
          # Only run cpack if CPack is configured
          if [ -f "CPackConfig.cmake" ]; then
            cpack -G DragNDrop
          else
            echo "No CPack configuration found. Creating simple archive..."
            if [ -f "eden" ]; then
              mkdir -p Eden.app/Contents/MacOS
              cp eden Eden.app/Contents/MacOS/
              tar -czf Eden-macOS.tar.gz Eden.app
            elif [ -f "Eden" ]; then
              mkdir -p Eden.app/Contents/MacOS
              cp Eden Eden.app/Contents/MacOS/
              tar -czf Eden-macOS.tar.gz Eden.app
            fi
          fi
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eden-macOS
          path: |
            build/*.dmg
            build/*.tar.gz
          if-no-files-found: warn
