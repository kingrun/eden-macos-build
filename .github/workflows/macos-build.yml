name: Build Eden macOS
on:
  push:
    branches: [macos]
  pull_request:
    branches: [macos]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        run: |
          git clone --recursive --depth=1 https://github.com/kingrun/eden-macos-build eden-build
          cd eden-build
          echo "PROJECT_DIR=$(pwd)" >> $GITHUB_ENV
          
      - name: Manual submodule initialization
        run: |
          cd $PROJECT_DIR
          # Create externals directory if missing
          mkdir -p externals
          
          # Clone cubeb directly into externals
          git clone --depth=1 https://github.com/mozilla/cubeb.git externals/cubeb
          
          # Verify we have the required files
          ls externals/cubeb/CMakeLists.txt || (echo "Cubeb not properly cloned!"; exit 1)

      - name: Install Dependencies
        run: |
          brew update
          brew install cmake qt@6 glew sdl2 libpng libzip ffmpeg pkgconfig
          brew link qt@6 --force

      - name: Setup Build Environment
        run: |
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)/lib/cmake" >> $GITHUB_ENV
          echo "PATH=$(brew --prefix qt@6)/bin:$PATH" >> $GITHUB_ENV

      - name: Configure Build
        run: |
          cd $PROJECT_DIR
          cmake -B build -DCMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH -DCMAKE_BUILD_TYPE=Release

      - name: Build Eden
        run: |
          cd $PROJECT_DIR
          cmake --build build --config Release --parallel $(sysctl -n hw.ncpu)

      - name: Package as DMG
        run: |
          cd $PROJECT_DIR/build
          cpack -G DragNDrop

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eden-macOS
          path: $PROJECT_DIR/build/*.dmg
