name: Build Eden macOS
on:
  push:
    branches: [macos]
  pull_request:
    branches: [macos]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # Critical: enables nested submodules
          fetch-depth: 0  # Fixes "Needed a single revision" errors :cite[8]

      - name: Force-reinitialize submodules
        run: |
          git submodule deinit --all -f
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Install Dependencies
        run: |
          brew update
          brew install cmake qt@6 glew sdl2 libpng libzip ffmpeg pkgconfig

      - name: Setup Qt 6
        run: |
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)" >> $GITHUB_ENV
          echo "PATH=$(brew --prefix qt@6)/bin:$PATH" >> $GITHUB_ENV

      - name: Configure Build
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH

      - name: Build Eden
        run: |
          cd build
          cmake --build . --config Release --parallel $(sysctl -n hw.ncpu)

      - name: Package as DMG
        run: |
          cd build
          cpack -G DragNDrop

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eden-macOS
          path: build/*.dmg
