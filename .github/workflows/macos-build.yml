name: Build Eden macOS

on:
  push:
    branches: [macos]
  pull_request:
    branches: [macos]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # Critical fix: initialize submodules

      - name: Install Dependencies
        run: |
          brew update
          brew install cmake qt@5 glew sdl2 libpng libzip ffmpeg

      - name: Setup Qt
        run: |
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@5)" >> $GITHUB_ENV
          echo "PATH=$(brew --prefix qt@5)/bin:$PATH" >> $GITHUB_ENV

      - name: Configure Build
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH

      - name: Build Eden
        run: |
          cd build
          cmake --build . --config Release --parallel

      - name: Package as DMG
        run: |
          cd build
          cpack -G DragNDrop

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eden-macOS
          path: build/*.dmg
