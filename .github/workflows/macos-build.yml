name: Build Eden for macOS

on:
  push:
    branches: [ "macos" ]
  pull_request:
    branches: [ "macos" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clone Eden source with submodules
      run: |
        git clone --recurse-submodules https://git.eden-emu.dev/eden-emu/eden.git eden-source

    - name: Apply compilation fix
      run: |
        sed -i '' 's/VideoCommon::Offset3D(0, 0, 0)/{0, 0, 0}/g' eden-source/src/video_core/renderer_vulkan/vk_texture_cache.cpp

    - name: Install dependencies
      run: |
        brew update
        brew install qt nlohmann-json fmt cmake ffmpeg glslang enet lz4 cubeb catch2 cpp-httplib molten-vk vulkan-loader boost
        brew install autoconf automake libtool pkg-config
        brew link --overwrite qt
        
        mkdir -p ${{ github.workspace }}/stb/include
        curl -L https://raw.githubusercontent.com/nothings/stb/master/stb_image.h -o ${{ github.workspace }}/stb/include/stb_image.h
        curl -L https://raw.githubusercontent.com/nothings/stb/master/stb_image_resize.h -o ${{ github.workspace }}/stb/include/stb_image_resize.h
        curl -L https://raw.githubusercontent.com/nothings/stb/master/stb_image_write.h -o ${{ github.workspace }}/stb/include/stb_image_write.h
        
        mkdir -p ${{ github.workspace }}/vma/include
        curl -L https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator/master/include/vk_mem_alloc.h -o ${{ github.workspace }}/vma/include/vk_mem_alloc.h
        
        echo "CMAKE_PREFIX_PATH=/opt/homebrew/opt/qt/lib/cmake:/opt/homebrew/lib/cmake:/opt/homebrew" >> $GITHUB_ENV
        echo "BOOST_ROOT=/opt/homebrew" >> $GITHUB_ENV
        echo "STB_INCLUDE_DIR=${{ github.workspace }}/stb/include" >> $GITHUB_ENV
        echo "VulkanMemoryAllocator_INCLUDE_DIR=${{ github.workspace }}/vma/include" >> $GITHUB_ENV

    - name: Configure CMake
      run: |
        cd eden-source
        cmake -B build \
          -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
          -DBOOST_ROOT="$BOOST_ROOT" \
          -DCMAKE_BUILD_TYPE=Release \
          -DUSE_SYSTEM_FMT=ON \
          -DUSE_SYSTEM_ENET=ON \
          -DUSE_SYSTEM_CUBEB=ON \
          -DUSE_SYSTEM_NLOHMANN_JSON=ON \
          -DUSE_SYSTEM_SPIRV_HEADERS=OFF \
          -DUSE_SYSTEM_VULKAN_MEMORY_ALLOCATOR=OFF \
          -DVulkanMemoryAllocator_INCLUDE_DIR="$VulkanMemoryAllocator_INCLUDE_DIR" \
          -DSTB_INCLUDE_DIR="$STB_INCLUDE_DIR" \
          -DENABLE_TZDB=OFF \
          -DEDEN_FFMPEG_BUILD_TYPE=Release \
          -DEDEN_BUILD_TESTS=OFF \
          -DCMAKE_FIND_FRAMEWORK=LAST \
          -DCMAKE_MACOSX_RPATH=ON

    - name: Build Eden
      run: |
        cd eden-source
        cmake --build build --config Release --parallel $(sysctl -n hw.logicalcpu)

    - name: Rename application bundle
      run: |
        cd eden-source/build/bin
        mv eden.app Eden.app
        mv Eden.app/Contents/MacOS/eden Eden.app/Contents/MacOS/Eden

    - name: Update Info.plist
      run: |
        cd eden-source/build/bin
        plutil -replace CFBundleExecutable -string "Eden" Eden.app/Contents/Info.plist
        plutil -replace CFBundleIdentifier -string "dev.eden-emu.Eden" Eden.app/Contents/Info.plist
        plutil -replace LSMinimumSystemVersion -string "11.0" Eden.app/Contents/Info.plist
        plutil -replace NSPrincipalClass -string NSApplication Eden.app/Contents/Info.plist

    - name: Deploy Qt frameworks
      run: |
        cd eden-source/build/bin
        
        # Fix RPATH issues before running macdeployqt
        install_name_tool -add_rpath @executable_path/../Frameworks Eden.app/Contents/MacOS/Eden
        
        # Run macdeployqt with supported options
        /opt/homebrew/bin/macdeployqt Eden.app -verbose=1 -always-overwrite
        
        # Add required libraries
        mkdir -p Eden.app/Contents/Frameworks
        
        # Find actual Vulkan library path
        VULKAN_LIB=$(find /opt/homebrew/lib -name 'libvulkan.*.dylib' -print -quit)
        if [ -n "$VULKAN_LIB" ]; then
          cp "$VULKAN_LIB" Eden.app/Contents/Frameworks/
          install_name_tool -id @rpath/$(basename "$VULKAN_LIB") Eden.app/Contents/Frameworks/$(basename "$VULKAN_LIB")
        fi
        
        # Find actual MoltenVK library path
        MOLTENVK_LIB=$(find /opt/homebrew/lib -name 'libMoltenVK.dylib' -print -quit)
        if [ -n "$MOLTENVK_LIB" ]; then
          cp "$MOLTENVK_LIB" Eden.app/Contents/Frameworks/
          install_name_tool -id @rpath/$(basename "$MOLTENVK_LIB") Eden.app/Contents/Frameworks/$(basename "$MOLTENVK_LIB")
        fi
        
        # Find actual cubeb library path
        CUBEB_LIB=$(find /opt/homebrew/lib -name 'libcubeb.*.dylib' -print -quit)
        if [ -n "$CUBEB_LIB" ]; then
          cp "$CUBEB_LIB" Eden.app/Contents/Frameworks/
          install_name_tool -id @rpath/$(basename "$CUBEB_LIB") Eden.app/Contents/Frameworks/$(basename "$CUBEB_LIB")
        fi

    - name: Sign application
      run: |
        cd eden-source/build/bin
        
        # Create temporary keychain for signing
        security create-keychain -p actions build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p actions build.keychain
        security set-keychain-settings -u build.keychain
        
        # Sign all frameworks and libraries first
        find Eden.app/Contents/Frameworks -type f -name "*.dylib" -exec codesign --force --sign - --timestamp --options=runtime {} \;
        find Eden.app/Contents/Frameworks -type d -name "*.framework" -exec codesign --force --sign - --timestamp --options=runtime {} \;
        
        # Sign the main executable
        codesign --force --sign - --timestamp --options=runtime Eden.app/Contents/MacOS/Eden
        
        # Finally sign the entire app bundle
        codesign --force --deep --sign - --timestamp --options=runtime Eden.app

    - name: Create DMG
      run: |
        brew install create-dmg
        mkdir -p ${{ github.workspace }}/artifact
        cd eden-source/build/bin
        
        VOLICON=""
        BACKGROUND=""
        
        if [ -f "${{ github.workspace }}/eden-source/distribution/macosx/eden.icns" ]; then
          VOLICON="--volicon ${{ github.workspace }}/eden-source/distribution/macosx/eden.icns"
        fi
        
        if [ -f "${{ github.workspace }}/eden-source/distribution/macosx/background.png" ]; then
          BACKGROUND="--background ${{ github.workspace }}/eden-source/distribution/macosx/background.png"
        fi
        
        create-dmg \
          --volname "Eden Emulator" \
          $VOLICON \
          $BACKGROUND \
          --window-pos 200 120 \
          --window-size 800 400 \
          --icon-size 100 \
          --icon "Eden.app" 200 190 \
          --app-drop-link 600 185 \
          "${{ github.workspace }}/artifact/Eden.dmg" \
          "Eden.app"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Eden-macOS
        path: ${{ github.workspace }}/artifact
        retention-days: 1
