name: Build Eden macOS
on:
  push:
    branches: [macos]
  pull_request:
    branches: [macos]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Clone official Eden with submodules
        run: |
          git clone --recursive https://git.eden-emu.dev/eden-emu/eden eden-source
          echo "SOURCE_DIR=$(pwd)/eden-source" >> $GITHUB_ENV
          echo "PROJECT_DIR=$(pwd)/eden-build" >> $GITHUB_ENV

      - name: Create clean build directory
        run: |
          mkdir eden-build
          # Copy only needed files, excluding problematic submodules
          rsync -av --exclude='.git' --exclude='externals/nx_tzdb' eden-source/ eden-build/
          mkdir -p eden-build/.github/workflows
          cp eden-source/.github/workflows/* eden-build/.github/workflows/ || true

      - name: Patch CMakeLists to skip tzdb check
        run: |
          cd $PROJECT_DIR
          # Backup original CMakeLists.txt
          cp CMakeLists.txt CMakeLists.txt.bak
          # Remove the submodule check for nx_tzdb
          sed -i '' '/externals\/nx_tzdb\/tzdb_to_nx\/externals\/tz\/tz/d' CMakeLists.txt

      - name: Install Build Dependencies
        run: |
          brew update
          brew install cmake qt@6 glew sdl2 libpng libzip ffmpeg pkgconfig
          brew install nlohmann-json cereal
          brew install enet openal-soft cubeb
          brew install vulkan-headers spirv-tools boost
          brew install fmt lz4 zstd
          brew install catch2 libusb
          brew install autoconf automake libtool nasm
          brew link qt@6 --force

      - name: Setup Build Environment
        run: |
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)/lib/cmake:$(brew --prefix)/lib/cmake" >> $GITHUB_ENV
          echo "PATH=$(brew --prefix qt@6)/bin:$(brew --prefix autoconf)/bin:$(brew --prefix automake)/bin:$(brew --prefix libtool)/bin:$PATH" >> $GITHUB_ENV
          echo "nlohmann_json_DIR=$(brew --prefix nlohmann-json)/share/cmake/nlohmann_json" >> $GITHUB_ENV

      - name: Configure Build
        run: |
          cd $PROJECT_DIR
          cmake -B build \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_SYSTEM_FMT=ON \
            -DUSE_SYSTEM_ENET=ON \
            -DUSE_SYSTEM_CUBEB=ON \
            -DUSE_SYSTEM_NLOHMANN_JSON=ON \
            -DUSE_SYSTEM_SPIRV_HEADERS=OFF \
            -DENABLE_TZDB=OFF \
            -DEDEN_FFMPEG_BUILD_TYPE=Release

      - name: Build Eden
        run: |
          cd $PROJECT_DIR
          cmake --build build --config Release --parallel $(sysctl -n hw.ncpu)

      - name: Package as DMG
        run: |
          cd $PROJECT_DIR/build
          cpack -G DragNDrop

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eden-macOS
          path: $PROJECT_DIR/build/*.dmg
