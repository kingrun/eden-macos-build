name: Build Eden for macOS

on:
  push:
    branches: [ "macos" ]
  pull_request:
    branches: [ "macos" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clone Eden source with submodules
      run: |
        git clone --recurse-submodules https://git.eden-emu.dev/eden-emu/eden.git eden-source

    - name: Apply compilation fix
      run: |
        sed -i '' 's/VideoCommon::Offset3D(0, 0, 0)/{0, 0, 0}/g' eden-source/src/video_core/renderer_vulkan/vk_texture_cache.cpp

    - name: Install dependencies
      run: |
        brew update
        brew install qt nlohmann-json fmt cmake ffmpeg glslang enet lz4 cubeb catch2 cpp-httplib molten-vk vulkan-loader boost
        brew install autoconf automake libtool pkg-config
        brew link --overwrite qt
        
        mkdir -p ${{ github.workspace }}/stb/include
        curl -L https://raw.githubusercontent.com/nothings/stb/master/stb_image.h -o ${{ github.workspace }}/stb/include/stb_image.h
        curl -L https://raw.githubusercontent.com/nothings/stb/master/stb_image_resize.h -o ${{ github.workspace }}/stb/include/stb_image_resize.h
        curl -L https://raw.githubusercontent.com/nothings/stb/master/stb_image_write.h -o ${{ github.workspace }}/stb/include/stb_image_write.h
        
        mkdir -p ${{ github.workspace }}/vma/include
        curl -L https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator/master/include/vk_mem_alloc.h -o ${{ github.workspace }}/vma/include/vk_mem_alloc.h
        
        echo "CMAKE_PREFIX_PATH=/opt/homebrew/opt/qt/lib/cmake:/opt/homebrew/lib/cmake:/opt/homebrew" >> $GITHUB_ENV
        echo "BOOST_ROOT=/opt/homebrew" >> $GITHUB_ENV
        echo "STB_INCLUDE_DIR=${{ github.workspace }}/stb/include" >> $GITHUB_ENV
        echo "VulkanMemoryAllocator_INCLUDE_DIR=${{ github.workspace }}/vma/include" >> $GITHUB_ENV

    - name: Configure CMake
      run: |
        cd eden-source
        cmake -B build \
          -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
          -DBOOST_ROOT="$BOOST_ROOT" \
          -DCMAKE_BUILD_TYPE=Release \
          -DUSE_SYSTEM_FMT=ON \
          -DUSE_SYSTEM_ENET=ON \
          -DUSE_SYSTEM_CUBEB=ON \
          -DUSE_SYSTEM_NLOHMANN_JSON=ON \
          -DUSE_SYSTEM_SPIRV_HEADERS=OFF \
          -DUSE_SYSTEM_VULKAN_MEMORY_ALLOCATOR=OFF \
          -DVulkanMemoryAllocator_INCLUDE_DIR="$VulkanMemoryAllocator_INCLUDE_DIR" \
          -DSTB_INCLUDE_DIR="$STB_INCLUDE_DIR" \
          -DENABLE_TZDB=OFF \
          -DEDEN_FFMPEG_BUILD_TYPE=Release \
          -DEDEN_BUILD_TESTS=OFF \
          -DCMAKE_FIND_FRAMEWORK=LAST

    - name: Build Eden
      run: |
        cd eden-source
        cmake --build build --config Release --parallel $(sysctl -n hw.logicalcpu)

    - name: Prepare application bundle
      run: |
        cd eden-source/build/bin
        
        # Create proper app structure
        mkdir -p Eden.app/Contents/MacOS
        mkdir -p Eden.app/Contents/Resources
        mkdir -p Eden.app/Contents/Frameworks
        
        # Move executable to correct location
        mv yuzu Eden.app/Contents/MacOS/Eden
        
        # Create Info.plist using echo commands
        echo '<?xml version="1.0" encoding="UTF-8"?>' > Eden.app/Contents/Info.plist
        echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> Eden.app/Contents/Info.plist
        echo '<plist version="1.0">' >> Eden.app/Contents/Info.plist
        echo '<dict>' >> Eden.app/Contents/Info.plist
        echo '    <key>CFBundleExecutable</key>' >> Eden.app/Contents/Info.plist
        echo '    <string>Eden</string>' >> Eden.app/Contents/Info.plist
        echo '    <key>CFBundleIdentifier</key>' >> Eden.app/Contents/Info.plist
        echo '    <string>dev.eden-emu.Eden</string>' >> Eden.app/Contents/Info.plist
        echo '    <key>CFBundleName</key>' >> Eden.app/Contents/Info.plist
        echo '    <string>Eden</string>' >> Eden.app/Contents/Info.plist
        echo '    <key>CFBundlePackageType</key>' >> Eden.app/Contents/Info.plist
        echo '    <string>APPL</string>' >> Eden.app/Contents/Info.plist
        echo '    <key>CFBundleShortVersionString</key>' >> Eden.app/Contents/Info.plist
        echo '    <string>1.0.0</string>' >> Eden.app/Contents/Info.plist
        echo '    <key>CFBundleVersion</key>' >> Eden.app/Contents/Info.plist
        echo '    <string>1</string>' >> Eden.app/Contents/Info.plist
        echo '    <key>NSHighResolutionCapable</key>' >> Eden.app/Contents/Info.plist
        echo '    <true/>' >> Eden.app/Contents/Info.plist
        echo '    <key>LSMinimumSystemVersion</key>' >> Eden.app/Contents/Info.plist
        echo '    <string>11.0</string>' >> Eden.app/Contents/Info.plist
        echo '    <key>NSSupportsAutomaticGraphicsSwitching</key>' >> Eden.app/Contents/Info.plist
        echo '    <true/>' >> Eden.app/Contents/Info.plist
        echo '</dict>' >> Eden.app/Contents/Info.plist
        echo '</plist>' >> Eden.app/Contents/Info.plist

    - name: Deploy Qt frameworks
      run: |
        cd eden-source/build/bin
        /opt/homebrew/bin/macdeployqt Eden.app -verbose=1 -always-overwrite
        find Eden.app -name "*.dylib" -exec install_name_tool -delete_rpath /opt/homebrew/lib {} \;

    - name: Sign application
      run: |
        cd eden-source/build/bin
        codesign --force --deep --sign - --timestamp --options=runtime Eden.app

    - name: Create DMG
      run: |
        brew install create-dmg
        mkdir -p ${{ github.workspace }}/artifact
        cd eden-source/build/bin
        
        # Check if assets exist, use defaults if not
        if [ -f "${{ github.workspace }}/eden-source/distribution/macosx/eden.icns" ]; then
          VOLICON="--volicon ${{ github.workspace }}/eden-source/distribution/macosx/eden.icns"
        else
          VOLICON=""
        fi
        
        if [ -f "${{ github.workspace }}/eden-source/distribution/macosx/background.png" ]; then
          BACKGROUND="--background ${{ github.workspace }}/eden-source/distribution/macosx/background.png"
        else
          BACKGROUND=""
        fi
        
        create-dmg \
          --volname "Eden Emulator" \
          $VOLICON \
          $BACKGROUND \
          --window-pos 200 120 \
          --window-size 800 400 \
          --icon-size 100 \
          --icon "Eden.app" 200 190 \
          --app-drop-link 600 185 \
          "${{ github.workspace }}/artifact/Eden.dmg" \
          "Eden.app"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Eden-macOS
        path: ${{ github.workspace }}/artifact
        retention-days: 1
