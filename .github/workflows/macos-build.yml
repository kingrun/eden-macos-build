name: Build Eden macOS

on:
  push:
    branches:
      - macos
  pull_request:
    branches:
      - macos
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Clone repo (full, macos branch)
        run: |
          git clone --branch macos --depth=1 https://github.com/${{ github.repository }} .
      
      - name: Initialize and update submodules (recursive, force)
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force --verbose

      - name: Verify cubeb submodule exists
        run: |
          if [ ! -d "externals/cubeb" ]; then
            echo "ERROR: externals/cubeb submodule folder NOT FOUND!"
            exit 1
          else
            echo "externals/cubeb submodule found"
            ls -la externals/cubeb
          fi

      - name: Install dependencies
        run: |
          brew install cmake glew qt@5

      - name: Set up Qt
        run: |
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@5)" >> $GITHUB_ENV
          echo "PATH=$(brew --prefix qt@5)/bin:$PATH" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH

      - name: Build
        run: |
          cd build
          cmake --build . --config Release --parallel

      - name: Archive build (optional)
        uses: actions/upload-artifact@v4
        with:
          name: eden-macos-build
          path: build/*
