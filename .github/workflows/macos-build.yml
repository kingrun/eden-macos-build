name: Build Eden macOS
on:
  push:
    branches: [macos]
  pull_request:
    branches: [macos]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Clone official Eden with submodules
        run: |
          git clone --recursive https://git.eden-emu.dev/eden-emu/eden eden-source
          echo "SOURCE_DIR=$(pwd)/eden-source" >> $GITHUB_ENV
          echo "PROJECT_DIR=$(pwd)/eden-build" >> $GITHUB_ENV

      - name: Create clean build directory
        run: |
          mkdir eden-build
          # Copy only source files (ignore .git directories)
          find eden-source -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec cp -r {} eden-build/ \;
          # Copy .github separately if needed
          mkdir -p eden-build/.github/workflows
          cp eden-source/.github/workflows/* eden-build/.github/workflows/ || true

      - name: Install Dependencies
        run: |
          brew update
          # Core dependencies
          brew install cmake qt@6 glew sdl2 libpng libzip ffmpeg pkgconfig
          # Additional Eden-specific dependencies
          brew install fmt enet openal-soft cubeb
          # Required for some external modules
          brew install vulkan-headers spirv-tools boost
          brew link qt@6 --force
          # Verify fmt installation
          brew list fmt || (echo "fmt not installed!"; exit 1)

      - name: Setup Build Environment
        run: |
          # Set paths for all dependencies
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)/lib/cmake:$(brew --prefix)/lib/cmake" >> $GITHUB_ENV
          echo "PATH=$(brew --prefix qt@6)/bin:$PATH" >> $GITHUB_ENV
          # Set Vulkan path explicitly
          echo "VULKAN_SDK=$(brew --prefix vulkan-headers)" >> $GITHUB_ENV

      - name: Configure Build
        run: |
          cd $PROJECT_DIR
          # Add necessary CMake options
          cmake -B build \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_SYSTEM_FMT=ON \
            -DUSE_SYSTEM_ENET=ON \
            -DUSE_SYSTEM_CUBEB=ON \
            -DUSE_SYSTEM_SPIRV_HEADERS=OFF  # Prefer bundled SPIRV headers

      - name: Build Eden
        run: |
          cd $PROJECT_DIR
          cmake --build build --config Release --parallel $(sysctl -n hw.ncpu)

      - name: Package as DMG
        run: |
          cd $PROJECT_DIR/build
          cpack -G DragNDrop

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eden-macOS
          path: $PROJECT_DIR/build/*.dmg
