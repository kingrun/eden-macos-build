name: Build Eden macOS
on:
  push:
    branches: [macos]
  pull_request:
    branches: [macos]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ github.token }}
          
      - name: Force submodule update
        run: |
          git config --global --add safe.directory '*'
          git config --global protocol.file.allow always
          git submodule sync --recursive
          git submodule update --init --recursive --force --jobs 4
          
      - name: Verify submodules
        run: |
          echo "Checking submodule status..."
          git submodule status --recursive
          
          # List critical paths
          echo "Checking critical externals:"
          ls -la externals/ || echo "externals directory missing"
          ls -la externals/cubeb/ || echo "cubeb missing"
          ls -la externals/libusb/ || echo "libusb parent missing"
          ls -la externals/libusb/libusb/ || echo "libusb/libusb missing"
          
      - name: Install Dependencies
        run: |
          brew update
          brew install \
            cmake \
            ninja \
            pkg-config \
            qt@6 \
            glew \
            sdl2 \
            libpng \
            libzip \
            ffmpeg \
            opus \
            enet \
            fmt \
            catch2 \
            boost \
            vulkan-headers \
            molten-vk
            
      - name: Setup Qt Environment
        run: |
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)" >> $GITHUB_ENV
          echo "$(brew --prefix qt@6)/bin" >> $GITHUB_PATH
          echo "PKG_CONFIG_PATH=$(brew --prefix qt@6)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig" >> $GITHUB_ENV
          echo "Qt6_DIR=$(brew --prefix qt@6)/lib/cmake/Qt6" >> $GITHUB_ENV
          
      - name: Configure Build
        run: |
          mkdir -p build
          cd build
          
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6);$(brew --prefix)" \
            -DQt6_DIR="$(brew --prefix qt@6)/lib/cmake/Qt6" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DENABLE_TESTS=OFF \
            -DENABLE_COMPATIBILITY_TESTS=OFF
            
      - name: Build Eden
        run: |
          cd build
          ninja -j$(sysctl -n hw.ncpu)
          
      - name: Package executable
        run: |
          cd build
          echo "Looking for Eden executable..."
          find . -name "*eden*" -type f 2>/dev/null || echo "No eden files found"
          
          # Find and package the executable
          if [ -f "eden" ]; then
            echo "Found eden executable"
            mkdir -p Eden-macOS
            cp eden Eden-macOS/
            tar -czf Eden-macOS.tar.gz Eden-macOS/
          elif [ -f "src/eden" ]; then
            echo "Found src/eden executable"
            mkdir -p Eden-macOS
            cp src/eden Eden-macOS/
            tar -czf Eden-macOS.tar.gz Eden-macOS/
          else
            echo "Creating archive of entire build directory"
            tar -czf Eden-macOS.tar.gz *
          fi
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eden-macOS
          path: build/*.tar.gz
          if-no-files-found: warn
