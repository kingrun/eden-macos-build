name: Build Eden macOS
on:
  push:
    branches: [macos]
  pull_request:
    branches: [macos]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Don't fetch submodules initially - we'll handle them manually
        
      # Manual submodule handling - bypassing Git's submodule system
      - name: Manual submodule setup
        run: |
          echo "Setting up all submodules manually based on .gitmodules..."
          
          # Create externals directory
          mkdir -p externals
          
          # Main level submodules
          echo "Cloning main level submodules..."
          
          # cubeb
          git clone --depth=1 https://github.com/mozilla/cubeb.git externals/cubeb
          
          # libusb (nested structure)
          mkdir -p externals/libusb
          git clone --depth=1 https://github.com/libusb/libusb.git externals/libusb/libusb
          
          # Vulkan-Headers
          git clone --depth=1 https://github.com/KhronosGroup/Vulkan-Headers.git externals/Vulkan-Headers
          
          # xbyak
          git clone --depth=1 https://github.com/Lizzie841/xbyak.git externals/xbyak
          
          # opus
          git clone --depth=1 https://github.com/xiph/opus.git externals/opus
          
          # cpp-httplib
          git clone --depth=1 https://github.com/yhirose/cpp-httplib.git externals/cpp-httplib
          
          # ffmpeg (nested structure)
          mkdir -p externals/ffmpeg
          git clone --depth=1 https://github.com/FFmpeg/FFmpeg.git externals/ffmpeg/ffmpeg
          
          # vcpkg
          git clone --depth=1 https://github.com/microsoft/vcpkg.git externals/vcpkg
          
          # cpp-jwt
          git clone --depth=1 https://github.com/arun11299/cpp-jwt.git externals/cpp-jwt
          
          # VulkanMemoryAllocator
          git clone --depth=1 https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator.git externals/VulkanMemoryAllocator
          
          # Vulkan-Utility-Libraries
          git clone --depth=1 https://github.com/KhronosGroup/Vulkan-Utility-Libraries.git externals/Vulkan-Utility-Libraries
          
          # boost-headers
          git clone --depth=1 https://github.com/boostorg/headers.git externals/boost-headers
          
          # SPIRV-Tools
          git clone --depth=1 https://github.com/KhronosGroup/SPIRV-Tools.git externals/SPIRV-Tools
          
          echo "Setting up dynarmic and its nested submodules..."
          # dynarmic (this needs to be cloned first for its nested structure)
          git clone --depth=1 https://github.com/merryhime/dynarmic.git externals/dynarmic
          
          # dynarmic nested submodules
          mkdir -p externals/dynarmic/externals
          git clone --depth=1 https://github.com/catchorg/Catch2.git externals/dynarmic/externals/catch
          git clone --depth=1 https://github.com/fmtlib/fmt.git externals/dynarmic/externals/fmt
          git clone --depth=1 https://github.com/Lizzie841/unordered_dense.git externals/dynarmic/externals/unordered_dense
          git clone --depth=1 https://github.com/zyantific/zycore-c.git externals/dynarmic/externals/zycore-c
          git clone --depth=1 https://github.com/zyantific/zydis.git externals/dynarmic/externals/zydis
          
          echo "Setting up nx_tzdb nested structure..."
          # nx_tzdb nested structure
          mkdir -p externals/nx_tzdb/tzdb_to_nx/externals/tz
          git clone --depth=1 https://github.com/eggert/tz.git externals/nx_tzdb/tzdb_to_nx/externals/tz/tz
          
          echo "Setting up sirit nested structure..."
          # sirit nested structure
          mkdir -p externals/sirit/externals
          git clone --depth=1 https://github.com/KhronosGroup/SPIRV-Headers.git externals/sirit/externals/SPIRV-Headers
          
          echo "Listing final externals structure:"
          find externals -type d -maxdepth 4 | sort
          
      - name: Verify critical dependencies
        run: |
          echo "Verifying all critical dependencies exist..."
          
          # List of all required submodules based on .gitmodules
          REQUIRED_PATHS=(
            "externals/cubeb"
            "externals/libusb/libusb"
            "externals/Vulkan-Headers"
            "externals/xbyak"
            "externals/opus"
            "externals/cpp-httplib"
            "externals/ffmpeg/ffmpeg"
            "externals/vcpkg"
            "externals/cpp-jwt"
            "externals/VulkanMemoryAllocator"
            "externals/Vulkan-Utility-Libraries"
            "externals/boost-headers"
            "externals/dynarmic/externals/catch"
            "externals/dynarmic/externals/fmt"
            "externals/dynarmic/externals/unordered_dense"
            "externals/dynarmic/externals/zycore-c"
            "externals/dynarmic/externals/zydis"
            "externals/nx_tzdb/tzdb_to_nx/externals/tz/tz"
            "externals/sirit/externals/SPIRV-Headers"
            "externals/SPIRV-Tools"
          )
          
          MISSING_COUNT=0
          
          for path in "${REQUIRED_PATHS[@]}"; do
            if [ -d "$path" ] && [ "$(ls -A "$path" 2>/dev/null)" ]; then
              echo "✓ $path found"
            else
              echo "✗ $path missing or empty"
              MISSING_COUNT=$((MISSING_COUNT + 1))
              
              # Show what actually exists in the parent directory
              parent_dir=$(dirname "$path")
              echo "  Contents of $parent_dir:"
              if [ -d "$parent_dir" ]; then
                ls -la "$parent_dir" | head -10
              else
                echo "  Parent directory doesn't exist"
              fi
            fi
          done
          
          if [ $MISSING_COUNT -gt 0 ]; then
            echo "ERROR: $MISSING_COUNT required dependencies are missing"
            echo "Final directory structure:"
            find externals -type d | sort
            exit 1
          else
            echo "SUCCESS: All required dependencies found!"
          fi
          
      - name: Install Dependencies
        run: |
          brew update
          brew install cmake qt@5 glew sdl2 libpng libzip ffmpeg pkg-config
          
      - name: Setup Qt Environment
        run: |
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@5)" >> $GITHUB_ENV
          echo "$(brew --prefix qt@5)/bin" >> $GITHUB_PATH
          echo "PKG_CONFIG_PATH=$(brew --prefix qt@5)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          
      - name: Configure Build
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@5)" \
            -DQt5_DIR="$(brew --prefix qt@5)/lib/cmake/Qt5" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 \
            -DENABLE_TESTS=OFF \
            -DENABLE_COMPATIBILITY_TESTS=OFF
            
      - name: Build Eden
        run: |
          cd build
          cmake --build . --config Release --parallel $(sysctl -n hw.ncpu)
          
      - name: Create App Bundle
        run: |
          cd build
          echo "Looking for Eden executable..."
          find . -name "*eden*" -type f -executable 2>/dev/null || echo "No eden executable found yet"
          ls -la
          
          # Try to find the main executable
          if [ -f "eden" ]; then
            echo "Found eden executable"
            EXECUTABLE="eden"
          elif [ -f "Eden" ]; then
            echo "Found Eden executable"
            EXECUTABLE="Eden"
          elif [ -f "src/eden" ]; then
            echo "Found src/eden executable"
            EXECUTABLE="src/eden"
          elif [ -f "src/Eden" ]; then
            echo "Found src/Eden executable"
            EXECUTABLE="src/Eden"
          else
            echo "Searching for any executable..."
            find . -type f -executable -name "*eden*" || echo "No eden executable found"
            EXECUTABLE=""
          fi
          
          if [ -n "$EXECUTABLE" ]; then
            echo "Creating app bundle with $EXECUTABLE"
            mkdir -p Eden.app/Contents/MacOS
            mkdir -p Eden.app/Contents/Resources
            
            # Copy executable
            cp "$EXECUTABLE" Eden.app/Contents/MacOS/Eden
            
            # Create Info.plist
            cat > Eden.app/Contents/Info.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Eden</string>
              <key>CFBundleIdentifier</key>
              <string>com.eden.emulator</string>
              <key>CFBundleName</key>
              <string>Eden</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
          </dict>
          </plist>
          EOF
            
            echo "App bundle created successfully"
          else
            echo "No executable found, creating archive of build directory"
          fi
          
      - name: Package
        run: |
          cd build
          
          if [ -d "Eden.app" ]; then
            # Create DMG if we have an app bundle
            echo "Creating DMG..."
            hdiutil create -srcfolder Eden.app -volname "Eden" -fs HFS+ -fsargs "-c c=64,a=16,e=16" -format UDRW temp-eden.dmg
            hdiutil convert temp-eden.dmg -format UDZO -imagekey zlib-level=9 -o Eden-macOS.dmg
            rm temp-eden.dmg
          else
            # Create tar.gz of build contents
            echo "Creating tar.gz archive..."
            tar -czf Eden-macOS.tar.gz *
          fi
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eden-macOS
          path: |
            build/*.dmg
            build/*.tar.gz
          if-no-files-found: warn
