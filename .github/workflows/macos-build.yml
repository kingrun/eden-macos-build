name: Build Eden macOS
on:
  push:
    branches: [macos]
  pull_request:
    branches: [macos]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # Full clone history required for submodules

      - name: Reset and force submodules
        run: |
          # Nuclear option: wipe submodule state
          git submodule deinit --all -f
          rm -rf .git/modules
          git config --unset-all submodule.recurse || true
          
          # Reinitialize from scratch
          git submodule sync --recursive
          git submodule update --init --force --recursive --depth=1
          
          # Verify cubeb exists
          ls externals/cubeb || (echo "Cubeb submodule missing!"; exit 1)

      - name: Install Dependencies
        run: |
          brew update
          brew install cmake qt@6 glew sdl2 libpng libzip ffmpeg pkgconfig
          brew link qt@6 --force

      - name: Setup Build Environment
        run: |
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)/lib/cmake" >> $GITHUB_ENV
          echo "PATH=$(brew --prefix qt@6)/bin:$PATH" >> $GITHUB_ENV

      - name: Configure Build
        run: |
          cmake -B build -DCMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH -DCMAKE_BUILD_TYPE=Release

      - name: Build Eden
        run: |
          cmake --build build --config Release --parallel $(sysctl -n hw.ncpu)

      - name: Package as DMG
        run: |
          cd build
          cpack -G DragNDrop

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eden-macOS
          path: build/*.dmg
