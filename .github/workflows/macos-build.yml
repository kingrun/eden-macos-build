name: Build Eden for macOS

on:
  push:
    branches: [ "macos" ]
  pull_request:
    branches: [ "macos" ]

jobs:
  build:
    runs-on: macos-latest
    env:
      PROJECT_DIR: ${{ github.workspace }}/eden-source
      CMAKE_PREFIX_PATH: /opt/homebrew/opt/qt/lib/cmake:/opt/homebrew/lib/cmake

    steps:
    - name: Checkout repository with submodules
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        path: eden-source

    - name: Install dependencies
      run: |
        brew update
        brew install qt nlohmann-json fmt cmake ffmpeg glslang enet lz4 cubeb
        brew link --overwrite qt
        echo "CMAKE_PREFIX_PATH=/opt/homebrew/opt/qt/lib/cmake:/opt/homebrew/lib/cmake" >> $GITHUB_ENV

    - name: Configure CMake
      run: |
        cd $PROJECT_DIR
        cmake -B build \
          -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
          -DCMAKE_BUILD_TYPE=Release \
          -DUSE_SYSTEM_FMT=ON \
          -DUSE_SYSTEM_ENET=ON \
          -DUSE_SYSTEM_CUBEB=ON \
          -DUSE_SYSTEM_NLOHMANN_JSON=ON \
          -DUSE_SYSTEM_SPIRV_HEADERS=OFF \
          -DENABLE_TZDB=OFF \
          -DEDEN_FFMPEG_BUILD_TYPE=Release

    - name: Build Eden
      run: |
        cd $PROJECT_DIR
        cmake --build build --config Release --parallel $(sysctl -n hw.logicalcpu)

    - name: Package application
      run: |
        mkdir -p ${{ github.workspace }}/artifact
        cp -R $PROJECT_DIR/build/bin/Eden.app ${{ github.workspace }}/artifact/

    - name: Upload artifact
      uses: actions/upload-artifact@v4  # Updated from v3 to v4
      with:
        name: Eden-macOS
        path: ${{ github.workspace }}/artifact
        retention-days: 1
