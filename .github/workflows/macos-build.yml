name: Build Eden for macOS

on:
  push:
    branches: [ "macos" ]
  pull_request:
    branches: [ "macos" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clone Eden source with submodules
      run: |
        git clone --recurse-submodules https://git.eden-emu.dev/eden-emu/eden.git eden-source

    - name: Install dependencies
      run: |
        brew update
        # Core dependencies
        brew install qt nlohmann-json fmt cmake ffmpeg glslang enet lz4 cubeb
        
        # Additional dependencies found in the error log
        brew install catch2 cpp-httplib vulkan-memory-allocator stb
        brew install --HEAD oaknut
        brew install dynarmic
        
        # Link Qt properly
        brew link --overwrite qt
        
        # Set environment variables
        echo "CMAKE_PREFIX_PATH=/opt/homebrew/opt/qt/lib/cmake:/opt/homebrew/lib/cmake:/opt/homebrew" >> $GITHUB_ENV
        echo "Catch2_DIR=/opt/homebrew/lib/cmake/Catch2" >> $GITHUB_ENV
        echo "oaknut_DIR=/opt/homebrew/share/oaknut/cmake" >> $GITHUB_ENV
        echo "dynarmic_DIR=/opt/homebrew/share/dynarmic/cmake" >> $GITHUB_ENV

    - name: Configure CMake
      run: |
        cd eden-source
        cmake -B build \
          -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
          -DCMAKE_BUILD_TYPE=Release \
          -DUSE_SYSTEM_FMT=ON \
          -DUSE_SYSTEM_ENET=ON \
          -DUSE_SYSTEM_CUBEB=ON \
          -DUSE_SYSTEM_NLOHMANN_JSON=ON \
          -DUSE_SYSTEM_SPIRV_HEADERS=OFF \
          -DUSE_SYSTEM_CATCH2=ON \
          -DUSE_SYSTEM_STB=ON \
          -DUSE_SYSTEM_CPP_JWT=ON \
          -DUSE_SYSTEM_HTTPLIB=ON \
          -DUSE_SYSTEM_OAKNUT=ON \
          -DUSE_SYSTEM_DYNARMIC=ON \
          -DUSE_SYSTEM_VULKAN_MEMORY_ALLOCATOR=ON \
          -DENABLE_TZDB=OFF \
          -DEDEN_FFMPEG_BUILD_TYPE=Release \
          -DEDEN_BUILD_TESTS=OFF

    - name: Build Eden
      run: |
        cd eden-source
        cmake --build build --config Release --parallel $(sysctl -n hw.logicalcpu)

    - name: Package application
      run: |
        mkdir -p ${{ github.workspace }}/artifact
        cp -R eden-source/build/bin/Eden.app ${{ github.workspace }}/artifact/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Eden-macOS
        path: ${{ github.workspace }}/artifact
        retention-days: 1
